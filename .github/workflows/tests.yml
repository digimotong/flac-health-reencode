name: tests

on:
  push:
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Both job ids below are required status checks on `main`, so their *names* are
# load-bearing: the ruleset matches on `test` and `lint`, and renaming (or
# matrixing, which would rename to `lint (3.12)`) leaves that required context
# reporting nothing. An unreported required check does not fail - it blocks every
# merge behind "Expected - waiting for status to be reported".
#
# The bare `push:`/`pull_request:` triggers are load-bearing the same way: a
# `paths:`/`branches:` filter would skip the whole run on matching PRs, which is
# precisely when the required checks have to report.
#
# tests/case_workflow_contract.sh pins all of this, including that the job set stays
# mutable and that neither job grows a `strategy:`, `name:`, `if:` or `needs:`.
# The tagger repos require more contexts than this repo does (`parity`, `dockerfile`
# and a matrixed `test`), so the ruleset and the guard's REQUIRED_JOBS list are
# per-repository and must be changed together.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          # 'bash' and 'md5sum' (coreutils) are preinstalled on ubuntu-latest; only
          # jq needs installing.
          sudo apt-get install -y --no-install-recommends jq
        shell: bash

      - name: Run FLAC health/re-encode test suite
        # A hung case must fail rather than burn the job's full timeout. The suite
        # runs each case in its own subprocess, so 300s is a generous ceiling for a
        # healthy suite (seconds locally) that still catches an unbounded read/wait.
        run: timeout 300 bash tests/run_tests.sh
        shell: bash

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The repo's .gitignore denies everything by default and re-allows a short
      # allowlist, so a file the build needs can be silently ignored by git (this
      # happened to .shellcheckrc) and CI breaks on a clean clone while the
      # developer's working tree looks fine. Asserting the tracked set directly:
      # `git ls-files` reads the INDEX, so a file that exists locally but is ignored
      # is simply absent from this list.
      - name: Assert required files are tracked by git
        run: |
          missing=0
          for f in \
              flac_health_reencode.sh \
              README.md \
              LICENSE \
              .shellcheckrc \
              .gitignore \
              .github/workflows/tests.yml \
              .github/dependabot.yml \
              tests/run_tests.sh \
              tests/lint.sh \
              tests/helpers.sh \
              tests/stub_flac \
              tests/stub_metaflac \
              tests/source_guard_units.sh \
              tests/manual/lib.sh \
              tests/manual/run_manual.sh \
              tests/manual/README.md; do
            if ! git ls-files --error-unmatch "$f" > /dev/null 2>&1; then
              echo "::error file=$f::$f is not tracked by git (check .gitignore allowlist)"
              missing=1
            fi
          done
          # Every test case must be tracked too, so a new tests/case_*.sh cannot be
          # written and run locally yet silently never run in CI.
          while IFS= read -r case_file; do
            if ! git ls-files --error-unmatch "$case_file" > /dev/null 2>&1; then
              echo "::error file=$case_file::$case_file is not tracked by git (check .gitignore allowlist)"
              missing=1
            fi
          done < <(find tests -maxdepth 1 -name 'case_*.sh' | sort)
          # Same guard for the real-flac manual harness. `!tests/*` in .gitignore
          # does NOT descend into tests/manual/, so these need their own allowlist
          # entries; without this loop a new harness script could be committed
          # nowhere and the manual CI job would quietly run nothing.
          while IFS= read -r manual_file; do
            if ! git ls-files --error-unmatch "$manual_file" > /dev/null 2>&1; then
              echo "::error file=$manual_file::$manual_file is not tracked by git (check .gitignore allowlist)"
              missing=1
            fi
          done < <(find tests/manual -maxdepth 1 -type f | sort)
          if [ "$missing" -ne 0 ]; then
            echo "FAIL: required files are ignored by git; CI cannot see them."
            exit 1
          fi
          echo "ok: all required files are tracked."
        shell: bash

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
        shell: bash

      # The runner script is the single source of truth for how the repo is linted,
      # so CI cannot invoke shellcheck differently from a developer. It prints the
      # resolved version, which the pin below is asserted against: if apt starts
      # shipping a different shellcheck this fails with a clear message instead of
      # surfacing as mystery diagnostics.
      - name: Pin the shellcheck major.minor version
        run: |
          want="0.9"
          got="$(shellcheck --version | awk '/^version:/ {print $2}')"
          echo "shellcheck $got (pinned to $want.x)"
          if [ "${got%.*}" != "$want" ]; then
            echo "::error::shellcheck $got found, but the repo is pinned to $want.x;"
            echo "::error::review the new diagnostics (0.10 dropped e.g. --rcfile) before bumping."
            exit 1
          fi
        shell: bash

      - name: Run shellcheck on the production script and the test suite
        # A hung or wildly slow lint must fail rather than burn the job's full
        # timeout; the suite lints in about a second locally.
        run: timeout 120 bash tests/lint.sh
        shell: bash

  # Real-flac verification: the one thing tests/run_tests.sh structurally cannot
  # do, because it stubs flac/metaflac. This job installs the real package and
  # drives the actual encoder over damaged audio.
  #
  # DELIBERATELY NOT A REQUIRED CHECK, and not added to REQUIRED_JOBS in
  # tests/case_workflow_contract.sh: it depends on a third-party binary, real file
  # permissions and real CPU time, so it is the kind of job that goes red for
  # reasons that have nothing to do with this repository (an upstream flac
  # regression, a runner without the package). Keeping `test` and `lint` hermetic
  # means a required check can never be blocked by that. This job is a signal that
  # a human or a release gate reads, and it must not gain the keys the contract
  # test forbids on required jobs (`strategy:`, `name:`, `if:`, `needs:`).
  manual-real-flac:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          # jq/md5sum inspect the script's output; flac/metaflac are the real
          # binaries under test (the harness SKIPs without them).
          sudo apt-get install -y --no-install-recommends jq flac
        shell: bash

      - name: Run the real-flac manual harness
        # Generous ceiling: scenarios are dominated by deliberate sleeps and real
        # encoding, but an unbounded read/wait must still fail the job. The harness
        # exits 0 when the real tools are absent, so a skip is visible in the log
        # rather than a red build.
        run: timeout 600 bash tests/manual/run_manual.sh
        shell: bash
