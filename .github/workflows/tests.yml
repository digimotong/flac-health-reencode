name: tests

on:
  push:
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          # 'bash' and 'md5sum' (from coreutils) are already preinstalled on the
          # ubuntu-latest runner; only jq needs installing.
          sudo apt-get install -y --no-install-recommends jq
        shell: bash

      - name: Run FLAC health/re-encode test suite
        # A hung case must fail rather than burn the job's full timeout. The
        # suite runs each case in its own subprocess, so 300s is a generous
        # ceiling for a healthy suite (it completes in a few seconds locally)
        # that still catches an unbounded read/wait loop.
        run: timeout 300 bash tests/run_tests.sh
        shell: bash

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The repo's .gitignore denies everything by default and re-allows a short
      # allowlist. A file the build needs can therefore be silently ignored by
      # git (this actually happened to .shellcheckrc) and CI breaks on a clean
      # clone while the developer's working tree looks fine. Assert the tracked
      # set directly: `git ls-files` reads the INDEX, so a file that is present
      # locally but ignored is simply absent from this list.
      - name: Assert required files are tracked by git
        run: |
          missing=0
          for f in \
              flac_health_reencode.sh \
              README.md \
              .shellcheckrc \
              .gitignore \
              .github/workflows/tests.yml \
              .github/dependabot.yml \
              tests/run_tests.sh \
              tests/helpers.sh \
              tests/stub_flac \
              tests/stub_metaflac \
              tests/source_guard_units.sh; do
            if ! git ls-files --error-unmatch "$f" > /dev/null 2>&1; then
              echo "::error file=$f::$f is not tracked by git (check .gitignore allowlist)"
              missing=1
            fi
          done
          # Every test case must be tracked too, so a new tests/case_*.sh cannot
          # be written, run locally, and then silently never run in CI.
          while IFS= read -r case_file; do
            if ! git ls-files --error-unmatch "$case_file" > /dev/null 2>&1; then
              echo "::error file=$case_file::$case_file is not tracked by git (check .gitignore allowlist)"
              missing=1
            fi
          done < <(find tests -maxdepth 1 -name 'case_*.sh' | sort)
          if [ "$missing" -ne 0 ]; then
            echo "FAIL: required files are ignored by git; CI cannot see them."
            exit 1
          fi
          echo "ok: all required files are tracked."
        shell: bash

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
        shell: bash

      # -S style is the strictest threshold, so every diagnostic shellcheck can
      # emit is treated as a failure. The production script is the priority: it
      # is the artefact that rewrites the user's audio files.
      - name: Run shellcheck on the production script
        run: shellcheck -S style flac_health_reencode.sh
        shell: bash

      - name: Run shellcheck on the test suite and stubs
        run: shellcheck -S style tests/*.sh tests/stub_flac tests/stub_metaflac
        shell: bash
