name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # 'bash' and 'md5sum' (from coreutils) are already preinstalled on the
          # ubuntu-latest runner; only jq needs installing.
          sudo apt-get install -y --no-install-recommends jq
        shell: bash

      - name: Run FLAC health/re-encode test suite
        run: bash tests/run_tests.sh
        shell: bash
